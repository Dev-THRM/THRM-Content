      <a href="#feed">Feed</a>

    </div>

  <!-- HERO -->
  <section class="hero" id="hero">
    <video class="hero-video-bg" id="hero-video-bg" autoplay muted loop playsinline aria-hidden="true">
      <source src="assets/astro-falling.mp4" type="video/mp4" />
    </video>
    <div class="hero-inner">
      <h1 class="hero-title" id="hero-title">
        We build brands<br/>that people remember.
      </h1>
      <div class="hero-meta">
        <div class="hero-stat">
          <span class="stat-number" data-target="24">24</span><span class="stat-unit">.7K</span>
          <span class="stat-desc">Followers</span>
        </div>
        <div class="hero-stat">
          <span class="stat-number" data-target="1138">1100</span><span class="stat-unit">+</span>
          <span class="stat-desc">Videos</span>
        </div>
        <!-- <div class="hero-stat">
          <span class="stat-number" data-target="98">0</span><span class="stat-unit">%</span>
          <span class="stat-desc">Engagement</span>
        </div> -->
      </div>
      <div class="hero-cta">
        <a href="#feed" class="btn-primary" id="hero-cta-feed">View Feed</a>
        <!-- <a href="#contact" class="btn-secondary" id="hero-cta-contact">Work with us</a> -->
      </div>
    </div>
    <div class="hero-rule"></div>
  </section>

  <!-- FEED -->
  <section class="feed-section" id="feed">
    <div class="section-inner">

      <div class="section-header">
        <div class="section-header-left">
          <span class="section-label">YouTube</span>
          <h2 class="section-title">Latest drops</h2>
        </div>
        <div class="feed-tabs" id="feed-tabs" role="tablist">
          <button class="tab active" data-filter="all" id="tab-all" role="tab" aria-selected="true">All</button>
        </div>
      </div>

      <div class="feed-grid" id="feed-grid"></div>

      <div class="load-more-wrap">
        <button class="btn-load-more" id="load-more-btn">Load more</button>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <img src="assets/logo.png" alt="THRM Content" class="footer-logo-img" />
      <span class="footer-copy">2026. All rights reserved.</span>
    </div>
  </footer>

  <!-- POST MODAL -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Post detail">
    <div class="modal" id="post-modal">
      <button class="modal-close" id="modal-close" aria-label="Close">
        <span></span><span></span>
      </button>
      <div class="modal-body">
        <div class="modal-visual" id="modal-visual"></div>
        <div class="modal-info">
          <div class="modal-meta">
            <span class="modal-account">thrmdigitalmarketingagency</span>
            <span class="modal-date" id="modal-date"></span>
          </div>
          <p class="modal-caption" id="modal-caption"></p>
          <div class="modal-tags" id="modal-tags"></div>
          <div class="modal-actions">
            <div class="modal-stat">
              <span id="modal-likes">0</span> likes
            </div>
            <div class="modal-stat">
              <span id="modal-comments">0</span> comments
            </div>
          </div>
        </div>
